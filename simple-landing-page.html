<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Landing Page Example</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, var(--bg), #1e293b);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .hero {
      max-width: 720px;
      width: 100%;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-top: 0;
      font-size: 2.2rem;
      line-height: 1.2;
    }

    p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 16px 0 28px;
    }

    .cta {
      display: inline-block;
      background: var(--accent);
      color: #052e16;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 22px;
      border-radius: 10px;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .cta:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Build Your Next Project Faster</h1>
    <p>
      This is a simple landing page example with a headline, short supporting text,
      and a call-to-action button.
    </p>
    <a class="cta" href="#">Get Started</a>
  </section>
</body>
</html>
